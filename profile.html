<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile | SkyVault</title>

<link rel="stylesheet" href="/static/css/main.css">

<style>

.profile-box{
  max-width:450px;
  margin:auto;
  background:var(--card);
  padding:30px;
  border-radius:22px;
  border:1px solid var(--border);
  backdrop-filter:blur(15px);
}

.profile-img{
  width:140px;
  height:140px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid var(--border);
  margin:auto;
  display:block;
  cursor:pointer;
  transition:.3s;
}

.profile-img:hover{
  transform:scale(1.05);
  border-color:#2563eb;
}

input{
  width:100%;
  padding:12px 14px;
  margin-top:12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--glass);
  color:var(--text);
}

button{
  width:100%;
  margin-top:16px;
  padding:12px;
  border-radius:14px;
  border:none;
  background:linear-gradient(135deg,#2563eb,#9333ea);
  color:white;
  cursor:pointer;
  font-weight:600;
}
#bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}
</style>
</head>

<body>
<canvas id="bg"></canvas>
<div class="app">

<div class="sidebar">
  <div class="logo">☁ SkyVault</div>
  <a href="/dashboard" class="{{ 'active' if request.path == '/dashboard' else '' }}">🏠 Dashboard</a>

<a href="/files" class="{{ 'active' if request.path == '/files' else '' }}">📁 My Files</a>

<a href="/profile" class="{{ 'active' if request.path == '/profile' else '' }}">👤 Profile</a>

<a href="/settings" class="{{ 'active' if request.path == '/settings' else '' }}">⚙ Settings</a>

<a href="/trash" class="{{ 'active' if request.path == '/trash' else '' }}">🗑 Trash</a>

{% if session['email'] == 'salmangj112@gmail.com' %}
<a href="/admin">🛡 Admin</a>
<a href="/analytics">📊 Analytics</a>
{% endif %}


<div style="margin-top:auto"></div>

<a href="/logout">🚪 Logout</a>
</div>

<div class="main">

<h2 style="margin-bottom:20px">My Profile</h2>

<div class="profile-box">

<form method="POST" enctype="multipart/form-data">

  <label>
    <img id="preview"
         src="/static/uploads/avatars/{{ user.avatar }}"
         class="profile-img">
    <input type="file" name="avatar" hidden onchange="previewImage(event)">
  </label>

  <input type="text" name="name" value="{{ user.name }}" required>

  <input type="email" name="email" value="{{ user.email }}" required>

  <button>Update Profile</button>

</form>

</div>

</div>
</div>

<script>

function previewImage(e){
  const img=document.getElementById("preview");
  img.src=URL.createObjectURL(e.target.files[0]);
}

</script>
<script src="/static/js/bg.js"></script>

</body>
</html>
