<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Settings | SkyVault</title>
<link rel="stylesheet" href="/static/css/main.css">
<link rel="stylesheet" href="/static/css/settings.css">
<style>
#bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}
</style>
</head>
<body>
  <canvas id="bg"></canvas>
<script src="/static/js/theme.js"></script>

<div class="app">

<div class="sidebar">
  <div class="logo">☁ SkyVault</div>
  <a href="/dashboard" class="{{ 'active' if request.path == '/dashboard' else '' }}">🏠 Dashboard</a>

<a href="/files" class="{{ 'active' if request.path == '/files' else '' }}">📁 My Files</a>

<a href="/profile" class="{{ 'active' if request.path == '/profile' else '' }}">👤 Profile</a>

<a href="/settings" class="{{ 'active' if request.path == '/settings' else '' }}">⚙ Settings</a>

<a href="/trash" class="{{ 'active' if request.path == '/trash' else '' }}">🗑 Trash</a>

{% if session['email'] == 'salmangj112@gmail.com' %}
<a href="/admin">🛡 Admin</a>
<a href="/analytics">📊 Analytics</a>
{% endif %}


<div style="margin-top:auto"></div>

<a href="/logout">🚪 Logout</a>
</div>

<div class="main">

<h2>Settings</h2>

<div class="settings-grid">


<div class="settings-card">
  <h3>Security</h3>
  <p>Change Password</p>
  <br>
  <button onclick="togglePassword()">Update</button>

  <form method="POST" id="passwordForm" class="password-form">
    <input type="password" name="old_password" placeholder="Old Password" required>
    <input type="password" name="new_password" placeholder="New Password" required>
    <input type="password" name="confirm_password" placeholder="Confirm New Password" required>
    <button type="submit">Save New Password</button>
  </form>
</div>

<div class="settings-card">
<h3>Storage</h3>
<p>Used: {{ used }} MB</p>
<p>Max: 18432  MB</p>
</div>

<div class="settings-card">
<h3>Account</h3>
<p>Delete Account</p>
<br>
<button class="danger">Delete</button>
</div>

</div>

</div>
</div>

<script>
function togglePassword(){
  const form = document.getElementById("passwordForm");
  form.style.display = form.style.display === "block" ? "none" : "block";
}
</script>

<script src="/static/js/bg.js"></script>
</body>
</html>
